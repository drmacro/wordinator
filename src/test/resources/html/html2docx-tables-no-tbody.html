<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>Tables without tbody</title></head>
<body>
  <table>
    <tr><td>bare-1a</td><td>bare-1b</td></tr>
    <tr><td>bare-2a</td><td>bare-2b</td></tr>
  </table>
  <p>Between</p>
  <table>
    <thead><tr><th>head-a</th><th>head-b</th></tr></thead>
    <tr><td>headed-1a</td><td>headed-1b</td></tr>
  </table>
  <p>Between</p>
  <table>
    <tbody><tr><td>body-1a</td><td>body-1b</td></tr></tbody>
  </table>
</body>
</html>
